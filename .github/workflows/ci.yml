name: CI

# The site is a static export served by a Cloudflare Worker. The board is baked in
# at build, so the heartbeat Worker dispatches `rebuild` every 15 min; the schedule
# is the backup. Master deploys; every other ref dry-runs the Worker bundle.
on:
  push:
    branches: [master]
  pull_request:
  repository_dispatch:
    types: [rebuild]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - if: github.ref != 'refs/heads/master' || github.event_name == 'pull_request'
        run: npx wrangler deploy --dry-run --outdir dist-dry
      - if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
